<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="">Personal Planner</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="groups">Groups</a>
        </li>
        @if (!currentUser()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="login">Login</a>
          </li>
        }
      </ul>

      @if (currentUser()) {
        <div class="d-flex align-items-center gap-2">
          <span class="navbar-text">{{ currentUser()!.email }}</span>
          <button mat-raised-button color="warn" (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </div>
</nav>
<!-- The routing placeholder thing (routerOutletData can be accessed by the other components, it'll be how they know what the current user is) -->
<router-outlet [routerOutletData]="currentUser()"></router-outlet>
